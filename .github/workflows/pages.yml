name: Pages

# Publishes the project site in site/ to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - src-tauri/icons/logo.svg
      - src-tauri/icons/icon.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the logo to the site
        run: |
          cp src-tauri/icons/logo.svg site/logo.svg
          cp src-tauri/icons/icon.png site/logo.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
