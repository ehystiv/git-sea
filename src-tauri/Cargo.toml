[package]
name = "git-sea"
version = "0.4.3"
description = "A read-only Git history viewer"
authors = ["Stefano Bichicchi (ehystiv)"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ehystiv/git-sea"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "git_sea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gix = { version = "0.89", default-features = false, features = ["blame", "blob-diff", "mailmap", "max-performance-safe", "revision", "sha1", "status"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
tauri-plugin-dialog = "2"
postcard = { version = "1", features = ["use-std"] }
notify = "8"
serde_yaml_ng = "0.10.0"
regex = "1.13.1"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }
sys-locale = "0.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Hands `git-sea <path>` run while the app is open to the running app, as a new tab.
tauri-plugin-single-instance = "2"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
keyring-core = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
